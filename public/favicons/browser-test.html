<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg?v=big-500-clean" type="image/svg+xml" />
    <title>Spin 500 favicon test</title>
    <style>
      :root {
        color-scheme: dark;
        --paper: #0c0c0e;
        --card: #18181c;
        --ink: #f4f2ec;
        --ink-soft: #a7a398;
        --line: #f4f2ec2b;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      main {
        width: min(520px, calc(100% - 40px));
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1;
      }

      p {
        margin: 0 0 20px;
        color: var(--ink-soft);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      img {
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Look at the tab</h1>
      <p>This page sets the active site favicon. The row below is just a size reference.</p>
      <div class="row">
        <img src="/favicon.svg?v=big-500-clean" width="16" height="16" alt="16px favicon" />
        <img src="/favicon.svg?v=big-500-clean" width="32" height="32" alt="32px favicon" />
        <img src="/favicon.svg?v=big-500-clean" width="64" height="64" alt="64px favicon" />
      </div>
    </main>
  </body>
</html>
